<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Autra Digital</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F9EEE0;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    header {
      margin-bottom: 20px;
    }
    header img {
      max-width: 200px;
    }
    h1 {
      color: #545454;
      font-size: 24px;
      margin-bottom: 20px;
    }
    form {
      background-color: #FFFFFF;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .back-button {
      background-color: #000000;
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.3s;
    }
    .back-button:hover {
      background-color: #333333;
    }
    .back-button i {
      margin-right: 5px;
    }
    label {
      color: #737373;
      font-size: 16px;
      margin-bottom: 5px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #A6A6A6;
      border-radius: 4px;
      font-size: 14px;
      color: #545454;
    }
    input::placeholder {
      color: #A6A6A6;
    }
    button {
      background-color: #000000;
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #333333;
    }
    @media (max-width: 768px) {
      form {
        width: 90%;
      }
      .back-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logotipo.png" alt="Autra Digital Logo">
  </header>
  <h1>Registro</h1>
  <button class="back-button" onclick="window.location.href='./index.html'"><i class="fas fa-arrow-left"></i> Atrás</button>
  <form id="registerForm">
    <label for="name">Nombre:</label>
    <input type="text" id="name" required placeholder="Tu nombre"><br>
    <label for="email">Email:</label>
    <input type="email" id="email" required placeholder="tuemail@dominio.com"><br>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" required placeholder="Tu contraseña"><br>
    <label for="role">Rol:</label>
    <select id="role" required>
      <option value="Terapeuta">Terapeuta</option>
      <option value="Formador">Formador</option>
      <option value="Paciente">Paciente</option>
    </select><br>
    <button type="submit">Registrarse</button>
  </form>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    console.log('Página de registro cargada correctamente.');
    const firebaseConfig = {
      apiKey: "AIzaSyBOz08UM2B4Dx2glw-1VsSOCm0dWBvegKM",
      authDomain: "autra-digital.firebaseapp.com",
      projectId: "autra-digital",
      storageBucket: "autra-digital.firebasestorage.app",
      messagingSenderId: "149401206632",
      appId: "1:149401206632:web:5ed11470a44b4ef648a0dd",
      measurementId: "G-MEVPRYBQC1"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault(); // Aseguramos que no se envíe el formulario por defecto
      console.log('Formulario de registro enviado.');
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      console.log(`Datos del usuario: Nombre=${name}, Email=${email}, Rol=${role}`);

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          console.log('Usuario autenticado con éxito, UID:', userCredential.user.uid);
          const user = userCredential.user;
          return db.collection('users').doc(user.uid).set({
            nombre: name,
            role: role
          });
        })
        .then(() => {
          console.log('Datos guardados en Firestore correctamente.');
          alert('Registro exitoso');
          window.location.href = './login.html';
        })
        .catch((error) => {
          console.error('Error en el registro:', error.message);
          alert('Error: ' + error.message);
        });
    });
  </script>
</body>
</html>
