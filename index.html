<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenido a Autra Digital</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
:root {
    /* Paleta solicitada */
    --accent: #ABC8E9;
    --accent-2: #ABC8E9;
    --text-strong: #545454; /* textos importantes */
    --text: #737373;        /* textos */

    /* Fondo claro con acentos */
    --bg1: #F9EEE0;
    --bg2: #F3E6D6;
    --bg3: #E8DACA;
    }

    /* ====== Reset & Base ====== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
      color: var(--text);
      background: radial-gradient(1200px 800px at 85% -10%, rgba(138, 124, 248, 0.25), transparent 60%),
                  radial-gradient(900px 700px at -10% 100%, rgba(46, 211, 230, 0.2), transparent 55%),
                  linear-gradient(160deg, var(--bg1), var(--bg2) 40%, var(--bg3));
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* ===== Ambient Orbs (decoración) ===== */
    .orb {
      position: absolute;
      filter: blur(40px);
      opacity: 0.7;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform, opacity;
    }
    .orb.one { width: 420px; height: 420px; background: radial-gradient(circle, #8a7cf8 0%, transparent 60%); top: -120px; right: -80px; animation: float1 10s ease-in-out infinite; }
    .orb.two { width: 520px; height: 520px; background: radial-gradient(circle, #2ed3e6 0%, transparent 60%); bottom: -140px; left: -120px; animation: float2 12s ease-in-out infinite; }
    @keyframes float1 { 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(-10px, 20px);} }
    @keyframes float2 { 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(14px, -18px);} }
    @media (prefers-reduced-motion: reduce) {
      .orb { animation: none; }
    }

    /* ===== Glass Card ===== */
    .wrap {
      position: relative;
      width: min(92vw, 980px);
      padding: clamp(20px, 4vw, 36px);
    }
    .glass {
      position: relative;
      padding: clamp(28px, 4vw, 44px);
      border-radius: var(--radius);
      background: var(--glass-bg);
      box-shadow: 0 20px 60px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      border: 1px solid var(--glass-stroke);
      isolation: isolate;
    }

    /* ===== Header ===== */
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    header .brand {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 14px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(138,124,248,0.14), rgba(46,211,230,0.08));
      border: 1px solid rgba(255,255,255,0.18);
    }
    header img { width: clamp(42px, 9vw, 72px); height: auto; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25)); }
    .brand h2 { margin: 0; font-size: clamp(16px, 2.2vw, 20px); font-weight: 700; letter-spacing: 0.3px; color: var(--text); }
    .brand span { display:block; font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ===== Title ===== */
    h1 {
      margin: 8px 0 18px;
      font-size: clamp(24px, 4.2vw, 40px);
      line-height: 1.08;
      letter-spacing: 0.2px;
      background: linear-gradient(90deg, var(--text), #cdd3ff 40%, #b3f4ff 85%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle { color: var(--muted); font-size: clamp(14px, 2.2vw, 16px); margin-bottom: 26px; }

    /* ===== Buttons ===== */
    .buttons { display: flex; flex-wrap: wrap; gap: 14px; }
    .btn {
      --ring: rgba(138,124,248,0.55);
      position: relative;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 18px; border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.22);
      color: var(--text); font-size: 15px; font-weight: 600; letter-spacing: .2px;
      text-decoration: none; cursor: pointer; user-select: none;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
      will-change: transform;
    }
    .btn i { font-size: 16px; opacity: 0.9; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,0.35); border-color: rgba(255,255,255,0.35); }
    .btn:active { transform: translateY(0); box-shadow: 0 8px 16px rgba(0,0,0,0.25); }
    .btn.primary { background: linear-gradient(135deg, rgba(138,124,248,0.28), rgba(46,211,230,0.22)); border-color: rgba(255,255,255,0.32); }

    /* Accent outlines / glow */
    .btn::after {
      content: ""; position: absolute; inset: -2px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(138,124,248,0.35), rgba(46,211,230,0.28));
      filter: blur(14px); opacity: 0; transition: opacity .2s ease;
      z-index: -1;
    }
    .btn:hover::after { opacity: 1; }

    /* ===== Footer / tiny info ===== */
    .meta { margin-top: 18px; font-size: 12px; color: var(--muted); }

    /* ===== Mobile tweaks ===== */
    @media (max-width: 640px) {
      .buttons { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }

    /* ===== Progressive enhancement: frosted edge ===== */
    .glass::before {
      content: ""; position: absolute; inset: 1px; border-radius: calc(var(--radius) - 1px);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      pointer-events: none; mix-blend-mode: screen;
    }

    /* Subtle divider */
    .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); margin: 20px 0; }
  </style>
