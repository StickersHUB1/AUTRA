<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Autra Digital</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Tipografías solicitadas -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #ABC8E9;
      --bg2: #F9EEE0;
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-stroke: rgba(255, 255, 255, 0.25);
      --text-important: #545454;
      --text-normal: #737373;
      --accent: #ABC8E9;
      --shadow: rgba(0, 0, 0, 0.25);
      --radius: 24px;
      --focus: 0 0 0 3px rgba(171, 200, 233, 0.55), 0 6px 20px rgba(0,0,0,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Lato', Montserrat, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
      color: var(--text-normal);
      background:
        radial-gradient(1200px 800px at 85% -10%, rgba(171,200,233,0.35), transparent 60%),
        radial-gradient(900px 700px at -10% 100%, rgba(171,200,233,0.25), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      display: grid; place-items: center; overflow: hidden; min-height: 100vh;
    }

    /* Ambient orbs */
    .orb { position: absolute; filter: blur(40px); opacity: 0.7; pointer-events: none; }
    .orb.one { width: 420px; height: 420px; background: radial-gradient(circle, var(--accent) 0%, transparent 60%); top: -120px; right: -80px; }
    .orb.two { width: 520px; height: 520px; background: radial-gradient(circle, var(--accent) 0%, transparent 60%); bottom: -140px; left: -120px; }

    .wrap { position: relative; width: min(92vw, 980px); padding: clamp(20px, 4vw, 36px); }

    .glass {
      position: relative;
      padding: clamp(24px, 4vw, 36px);
      border-radius: var(--radius);
      background: var(--glass-bg);
      box-shadow: 0 20px 60px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      border: 1px solid var(--glass-stroke);
    }

    header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    header .brand { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; background: rgba(171,200,233,0.15); border: 1px solid rgba(255,255,255,0.18); }
    header img { width: clamp(42px, 9vw, 72px); height: auto; object-fit: contain; }
    .brand h2 { margin: 0; font-size: clamp(16px, 2.2vw, 20px); font-weight: 700; color: var(--text-important); font-family: 'Montserrat', sans-serif; }
    .brand span { display:block; font-size: 12px; color: var(--text-normal); margin-top: 2px; }

    h1 { margin: 8px 0 6px; font-size: clamp(22px, 4.2vw, 34px); line-height: 1.08; color: var(--text-important); font-family: 'Montserrat', sans-serif; }
    .subtitle { color: var(--text-normal); margin-bottom: 18px; }

    .back-button {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.12));
      border: 1px solid rgba(255,255,255,0.22);
      color: var(--text-important);
      padding: 10px 14px; border-radius: 12px; cursor: pointer;
      font-weight: 600; font-family: 'Montserrat', sans-serif;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      margin-bottom: 12px;
    }
    .back-button:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.35); }

    form {
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.18));
      border: 1px solid var(--glass-stroke);
      border-radius: 16px;
      padding: clamp(18px, 3.2vw, 24px);
      box-shadow: 0 18px 48px rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.35);
      width: 100%; max-width: 420px;
    }

    label { color: var(--text-important); font-size: 14px; margin-bottom: 6px; display: block; font-weight: 600; font-family: 'Montserrat', sans-serif; }

    .field { position: relative; margin-bottom: 16px; }
    input {
      width: 100%; appearance: none;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(171,200,233,0.55);
      border-radius: 12px; padding: 12px 12px 12px 38px;
      font-size: 14px; color: var(--text-important);
      outline: none; transition: box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    input::placeholder { color: #9aa3ad; }
    input:focus { box-shadow: var(--focus); border-color: var(--accent); background: rgba(255,255,255,0.9); }

    .field i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .7; }

    .submit-btn {
      width: 100%;
      display: inline-flex; justify-content: center; align-items: center; gap: 10px;
      padding: 12px 18px; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, rgba(171,200,233,0.45), rgba(255,255,255,0.85));
      color: var(--text-important); border: 1px solid var(--glass-stroke);
      font-weight: 700; font-family: 'Montserrat', sans-serif; font-size: 15px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.35); }

    @media (max-width: 768px) {
      form { width: 92%; }
      .back-button { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <!-- Decor -->
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>

  <main class="wrap">
    <section class="glass" role="region" aria-label="Iniciar Sesión">
      <header>
        <div class="brand">
          <img src="autra-logo.png" alt="Autra Digital Logo" />
          <div>
            <h2>Autra Digital</h2>
            <span>Acceso seguro a la plataforma</span>
          </div>
        </div>
      </header>

      <h1>Iniciar Sesión</h1>
      <p class="subtitle">Introduce tus credenciales para continuar.</p>

      <button class="back-button" onclick="window.location.href='./index.html'">
        <i class="fas fa-arrow-left"></i> Atrás
      </button>

      <form id="loginForm">
        <label for="email">Email</label>
        <div class="field">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          <input type="email" id="email" required placeholder="tuemail@dominio.com" />
        </div>

        <label for="password">Contraseña</label>
        <div class="field">
          <i class="fas fa-lock" aria-hidden="true"></i>
          <input type="password" id="password" required placeholder="Tu contraseña" />
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
          <span>Iniciar Sesión</span>
        </button>
      </form>
    </section>
  </main>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Lógica -->
  <script>
    console.log('Página de inicio de sesión cargada correctamente.');
    const firebaseConfig = {
      apiKey: "AIzaSyBOz08UM2B4Dx2glw-1VsSOCm0dWBvegKM",
      authDomain: "autra-digital.firebaseapp.com",
      projectId: "autra-digital",
      storageBucket: "autra-digital.firebasestorage.app",
      messagingSenderId: "149401206632",
      appId: "1:149401206632:web:5ed11470a44b4ef648a0dd",
      measurementId: "G-MEVPRYBQC1"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Si ya está logueado, ir directo a Inicio
    auth.onAuthStateChanged((u) => { if (u) window.location.href = './inicio.html'; });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log(`Intentando iniciar sesión con Email=${email}`);

      auth.signInWithEmailAndPassword(email, password)
        .then(async (userCredential) => {
          const user = userCredential.user;
          console.log('Inicio de sesión exitoso, UID:', user.uid);

          try {
            // Resolvemos rol y lo dejamos cacheado para Inicio → Perfil
            const snap = await db.collection('users').doc(user.uid).get();
            if (snap.exists) {
              let role = snap.data().role || null;
              if (role === 'Formador') role = 'Admin'; // compat legacy
              sessionStorage.setItem('autra_user', JSON.stringify({ uid: user.uid, role, ts: Date.now() }));
              console.log('Rol cacheado para Inicio:', role);
            } else {
              console.warn('No se encontró el documento de rol; Inicio lo resolverá.');
            }
          } catch (err) {
            console.error('Error leyendo rol:', err);
          }

          // Nueva redirección unificada
          window.location.href = './inicio.html';
        })
        .catch((error) => {
          console.error('Error al iniciar sesión:', error.message);
          alert('Error al iniciar sesión: ' + error.message);
        });
    });
  </script>
</body>
</html>
