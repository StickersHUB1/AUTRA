<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil – Terapeuta | Autra Digital</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg1:#ABC8E9; --bg2:#F9EEE0;
      --text-strong:#545454; --text:#737373;
      --accent:#ABC8E9; --glass-stroke:rgba(171,200,233,.35);
      --glass:rgba(255,255,255,.12); --glass-strong:rgba(255,255,255,.22);
      --radius:22px; --shadow:0 24px 60px rgba(0,0,0,.12);
      --focus:0 0 0 3px rgba(171,200,233,.55), 0 6px 20px rgba(0,0,0,.12);
      --overlay: rgba(245, 245, 245, .75);
    }
    *, *::before, *::after{box-sizing:border-box}
    html,body{height:auto}
    body{
      margin:0; font-family:'Lato', Montserrat, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial;
      color:var(--text);
      background:radial-gradient(1200px 800px at 85% -10%, rgba(171,200,233,.35), transparent 60%),
                 radial-gradient(900px 700px at -10% 100%, rgba(171,200,233,.25), transparent 55%),
                 linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height:100dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    .orb{position:fixed; filter:blur(40px); opacity:.7; pointer-events:none}
    .orb.one{width:420px;height:420px;background:radial-gradient(circle,var(--accent) 0%, transparent 60%); top:-120px; right:-80px}
    .orb.two{width:520px;height:520px;background:radial-gradient(circle,var(--accent) 0%, transparent 60%); bottom:-140px; left:-120px}

    /* Topbar unificado */
    .topbar{position:sticky; top:0; z-index:20; backdrop-filter:blur(14px) saturate(120%); -webkit-backdrop-filter:blur(14px) saturate(120%);
      background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.4)); border-bottom:1px solid var(--glass-stroke);
      box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .topbar .container{max-width:1100px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:16px; justify-content:space-between}
    .brand{display:flex; align-items:center; gap:12px}
    .brand img{width:36px; height:36px; object-fit:contain}
    .brand h1{font:700 18px/1.1 'Montserrat', sans-serif; color:var(--text-strong); margin:0}
    nav ul{display:flex; list-style:none; gap:8px; margin:0; padding:0}
    .tab{appearance:none; border:1px solid var(--glass-stroke); border-radius:12px; padding:10px 14px; font:600 14px/1 'Montserrat', sans-serif; color:var(--text-strong);
      background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.75)); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px}
    .tab[aria-current="page"]{box-shadow:var(--focus)}
