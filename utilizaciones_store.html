<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Utilizaciones | Autra Digital</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg1:#ABC8E9; --bg2:#F9EEE0;
      --text-strong:#545454; --text:#737373;
      --accent:#ABC8E9; --glass-stroke:rgba(171,200,233,.35);
      --glass:rgba(255,255,255,.12); --glass-strong:rgba(255,255,255,.22);
      --radius:22px; --shadow:0 24px 60px rgba(0,0,0,.12);
    }
    body{margin:0; font-family:'Lato', Montserrat, system-ui, sans-serif;
      background:linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height:100vh; display:flex; flex-direction:column; color:var(--text);}
    header{padding:16px; border-bottom:1px solid var(--glass-stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.4));
      backdrop-filter:blur(14px); display:flex; justify-content:space-between; align-items:center;}
    header h1{margin:0; font:700 1.2rem 'Montserrat', sans-serif; color:var(--text-strong)}
    main{flex:1; max-width:600px; margin:32px auto; padding:0 18px; display:flex; justify-content:center}
    .card{border-radius:16px; border:1px solid var(--glass-stroke); background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78)); box-shadow:var(--shadow); padding:24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px; width:100%; max-width:400px}
    .btn{padding:12px 16px; border-radius:12px; border:1px solid var(--glass-stroke); background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.75)); font:700 1rem 'Montserrat', sans-serif; cursor:pointer;}
    input{padding:10px; border-radius:12px; border:1px solid var(--glass-stroke); text-align:center; font:1rem 'Lato', sans-serif; width:100px;}
    footer{text-align:center; padding:16px; font:.85rem 'Lato', sans-serif; opacity:.75}
  </style>
</head>
<body>
  <header>
    <h1>Tienda de Utilizaciones</h1>
    <a href="./inicio.html" class="btn"><i class="fas fa-arrow-left"></i> Volver</a>
  </header>

  <main>
    <div class="card">
      <h2><i class="fas fa-circle"></i> Comprar utilizaciones</h2>
      <p>Cada utilización cuesta 15 €. Ingresa cuántas deseas comprar:</p>
      <input type="number" id="cantidad" min="1" value="1" />
      <button id="btnPagar" class="btn"><i class="fas fa-credit-card"></i> Ir al pago</button>
    </div>
  </main>

  <footer>© 2025 Autra Digital</footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
  <!-- Stripe -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBOz08UM2B4Dx2glw-1VsSOCm0dWBvegKM",
      authDomain: "autra-digital.firebaseapp.com",
      projectId: "autra-digital",
      storageBucket: "autra-digital.firebasestorage.app",
      messagingSenderId: "149401206632",
      appId: "1:149401206632:web:5ed11470a44b4ef648a0dd",
      measurementId: "G-MEVPRYBQC1"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const functions = firebase.app().functions("us-central1");

    const stripe = Stripe("pk_test_51S6RK8AmzmAounhDFccgSZ3fn5Ap31bxqrmZkIVbom2s6906mi394xM2nqDlTwELuwlPIlcPfOEdmjSbVaOsdjAy00matHE2WH");

    document.getElementById("btnPagar").addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) return alert("Debes iniciar sesión primero");

      const cantidad = parseInt(document.getElementById("cantidad").value) || 1;

      const createSession = functions.httpsCallable("createCheckoutSession");
      const result = await createSession({ cantidad });
      const sessionId = result.data.id;

      const { error } = await stripe.redirectToCheckout({ sessionId });
      if (error) alert("Error al redirigir al checkout: " + error.message);
    });
  </script>
</body>
</html>
